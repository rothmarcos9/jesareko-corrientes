name: Copiar datos publicados (uso puntual)
on:
  push:
    paths: [".github/workflows/copiar-datos.yml"]
permissions:
  contents: write
jobs:
  copiar:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          git init -q c && cd c
          for f in datos.json ciudad.json estado.json; do curl -sfL -m 60 "https://rothmarcos9.github.io/jesareko-corrientes/$f" -o $f; done
          git config user.name "Jesareko (automático)"; git config user.email "rothmarcos9@users.noreply.github.com"
          git checkout -q -b capturas && git add -f . && git commit -qm "Copia de los datos publicados" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" capturas
