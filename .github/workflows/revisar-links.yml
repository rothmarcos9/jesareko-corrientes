name: Revisar links de la app
on:
  push:
    paths: [".github/workflows/revisar-links.yml"]
  workflow_dispatch:
jobs:
  revisar:
    runs-on: ubuntu-24.04
    steps:
      - name: Probar links
        run: |
          UA="Mozilla/5.0 (Linux; Android 13; SM-A135M) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Mobile Safari/537.36"
          for u in https://produccion-animal.com.ar/inundacion/100-Excesos_sudoeste_correntino.pdf https://www.produccion-animal.com.ar/suelos_ganaderos/107-mapeo_Corrientes.pdf https://geo.inta.gob.ar/ https://www.smn.gob.ar/alertas https://www.smn.gob.ar/radar https://www.windy.com/; do
            r=$(curl -s -L -m 25 -A "$UA" -o /tmp/b -w "%{http_code} %{url_effective} %{content_type}" "$u" 2>&1 || true)
            t=$(grep -o -i '<title>[^<]*' /tmp/b 2>/dev/null | head -1 | cut -c8-80)
            echo "::notice title=Link::$u -> $r | $t"
          done
