name: Bajar barrios y lagunas de OpenStreetMap
on:
  push:
    paths: [".github/workflows/bajar-osm.yml", "scripts/osm_ciudad.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  osm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Consultar Overpass
        run: mkdir -p datos/ciudad && python3 scripts/osm_ciudad.py
      - name: Guardar en el repositorio
        run: |
          git config user.name "Jesareko (automático)"; git config user.email "rothmarcos9@users.noreply.github.com"
          git add datos/ciudad/*.geojson datos/ciudad/barrios_puntos.json
          git commit -m "Datos de OpenStreetMap: barrios y cuerpos de agua de la ciudad de Corrientes (© colaboradores de OpenStreetMap, ODbL)" && git pull --rebase && git push || echo sin cambios
