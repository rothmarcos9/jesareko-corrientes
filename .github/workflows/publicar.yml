name: Actualizar datos y publicar

on:
  schedule:
    - cron: "17 * * * *"   # cada hora (GitHub puede demorarlo unos minutos)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  armar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: |
          pip install --quiet pillow pypdf
          sudo apt-get install -y -qq poppler-utils > /dev/null
      - name: Pronóstico, ríos, incendios y satélite
        run: python3 scripts/actualizar.py || echo "Alguna fuente falló; se usa el dato anterior"
      - name: Alturas del INA
        run: python3 scripts/ina.py ina.json || echo "INA no disponible"
      - name: Servicio Meteorológico Nacional
        run: python3 scripts/smn.py smn.json || echo "SMN no disponible"
      - name: Armar la página
        env:
          SITIO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          COMU_URL: https://claude.ai/artifact/8QiioDCRRDCaC3NeoxEYFm
          COMU_DIAG: "1"
        run: python3 scripts/armar_pagina.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: armar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
