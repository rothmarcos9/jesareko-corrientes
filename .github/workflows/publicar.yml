name: Actualizar datos y publicar

on:
  schedule:
    - cron: "17 * * * *"   # cada hora (GitHub puede demorarlo unos minutos)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  armar:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: |
          pip install --quiet pillow pypdf
          (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils) > /dev/null || echo "::warning::No se pudo instalar poppler-utils"
      - name: Pronóstico, ríos, incendios y satélite
        run: python3 scripts/actualizar.py || echo "Alguna fuente falló; se usa el dato anterior"
      - name: Alturas del INA
        env:
          SITIO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python3 scripts/ina.py ina.json || echo "INA no disponible"
      - name: Servicio Meteorológico Nacional
        run: python3 scripts/smn.py smn.json || echo "SMN no disponible"
      - name: Precisión del pronóstico
        env:
          SITIO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python3 scripts/verificar.py verificacion.json || echo "Verificación no disponible"
      - name: Armar la página
        env:
          SITIO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python3 scripts/armar_pagina.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: armar
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Avisar a los buscadores (IndexNow)
        if: github.event_name == 'push'
        continue-on-error: true
        run: curl -sS -m 30 "https://api.indexnow.org/indexnow?url=https://rothmarcos9.github.io/jesareko-corrientes/&key=2054cbf0ad5253f9355b55c86798a31d&keyLocation=https://rothmarcos9.github.io/jesareko-corrientes/2054cbf0ad5253f9355b55c86798a31d.txt" -o /dev/null -w "IndexNow %{http_code}\n"
