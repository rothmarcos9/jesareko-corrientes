name: Sonda CONAE
on:
  push:
    branches: [sonda-conae]
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sonda_conae.py
      - run: |
          git config user.name "Jesareko (automático)"; git config user.email "rothmarcos9@users.noreply.github.com"
          for f in sonda_*; do git add -f "$f"; done; git commit -m "resultado sonda"; git push
